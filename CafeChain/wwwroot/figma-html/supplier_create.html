<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thêm Nhà cung cấp mới — CafeChain Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root{--bg:#F7F3EE;--surface:#FFFFFF;--primary:#6F4E37;--primary-h:#5C3F2B;--accent:#C67A45;--text:#1F2937;--muted:#475569;--success:#2F6F5E;--warning:#99623B;--danger:#991B1B;--border:#E5E0D8;--radius:10px;--shadow:0 4px 24px rgba(111,78,55,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;}
/* Modal */
.modal-box{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(111,78,55,.18);width:760px;max-width:98vw;overflow:hidden;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-header-left{display:flex;align-items:center;gap:12px;}
.modal-icon{width:38px;height:38px;border-radius:10px;background:#F5EDE3;display:flex;align-items:center;justify-content:center;}
.modal-icon i{font-size:15px;color:var(--accent);}
.modal-header h5{font-size:16px;font-weight:800;color:var(--text);}
.close-btn{width:30px;height:30px;border-radius:7px;border:none;background:#F5EDE3;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.close-btn:hover{background:#FEE2E2;color:var(--danger);}
/* Wizard steps */
.wizard-steps{display:flex;align-items:center;padding:18px 28px;border-bottom:1px solid var(--border);background:#FAF7F4;gap:0;}
.wizard-step{display:flex;align-items:center;gap:10px;flex:1;}
.step-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:#E5E0D8;color:var(--muted);flex-shrink:0;transition:all .2s;}
.wizard-step.active .step-num{background:var(--primary);color:#fff;}
.wizard-step span{font-size:12px;font-weight:700;color:var(--muted);}
.wizard-step.active span{color:var(--primary);}
.wizard-line{flex:0 0 40px;height:2px;background:#DDD6CE;margin:0 10px;}
/* Modal body */
.modal-body{padding:24px;max-height:60vh;overflow-y:auto;}
/* Section title */
.section-title{font-size:11px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:7px;margin-bottom:14px;}
.section-title i{color:var(--accent);}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.col-span-2{grid-column:span 2;}
/* Form elements */
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.4px;}
.req{color:var(--danger);}
.form-control,.form-select{padding:9px 13px;border:1.5px solid #DDD6CE;border-radius:8px;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .18s,box-shadow .18s;}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(111,78,55,.13);}
/* Code display badge */
.code-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:#F5EDE3;border:1.5px solid #DBC4A9;color:var(--warning);font-size:13px;font-weight:800;}
/* Divider */
.divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
/* Tag primary / sub */
.tag-primary{display:inline-block;padding:3px 10px;background:var(--primary);color:#fff;border-radius:5px;font-size:11px;font-weight:700;}
.tag-sub{display:inline-block;padding:3px 10px;background:#F5EDE3;color:var(--warning);border:1px solid #DBC4A9;border-radius:5px;font-size:11px;font-weight:700;}
/* Primary row */
.primary-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
/* Add row */
.add-row{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
.add-row .form-control{flex:1;}
/* Secondary expand */
.secondary-box{background:#FAF7F4;border:1px solid var(--border);border-radius:8px;padding:16px;margin-top:12px;}
.secondary-box-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.secondary-box-hint{font-size:11px;color:var(--muted);}
.secondary-actions{display:flex;gap:8px;margin-top:12px;}
/* Panel */
.wizard-panel{display:none;}
.wizard-panel.active{display:block;}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all .18s;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(111,78,55,.25);}
.btn-primary:hover{background:var(--primary-h);}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#256058;}
.btn-outline{background:#fff;color:var(--muted);border:1.5px solid #D6C4B0;}
.btn-outline:hover{background:#F5F5F5;}
.btn-dark{background:var(--text);color:#fff;}
.btn-dark:hover{background:#374151;}
.btn-sm{padding:6px 13px;font-size:12px;}
/* Modal footer */
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);background:#FAF7F4;}
.modal-footer-spacer{flex:1;}
</style>
</head>
<body>
<div class="modal-box">
  <!-- Header -->
  <div class="modal-header">
    <div class="modal-header-left">
      <div class="modal-icon"><i class="fas fa-plus-circle"></i></div>
      <h5>Thêm Nhà Cung Cấp Mới</h5>
    </div>
    <button class="close-btn"><i class="fas fa-times"></i></button>
  </div>

  <!-- Wizard Steps -->
  <div class="wizard-steps">
    <div class="wizard-step active" data-step="1">
      <div class="step-num">1</div>
      <span>Thông tin &amp; Địa chỉ</span>
    </div>
    <div class="wizard-line"></div>
    <div class="wizard-step" data-step="2">
      <div class="step-num">2</div>
      <span>SĐT, Ngân hàng &amp; Liên hệ</span>
    </div>
  </div>

  <!-- Modal Body -->
  <div class="modal-body">

    <!-- STEP 1 -->
    <div id="createStep1" class="wizard-panel active">

      <!-- Thông tin cơ bản -->
      <div class="section-title"><i class="fas fa-building"></i>Thông tin cơ bản</div>
      <div class="grid-2" style="margin-bottom:6px;">
        <div class="form-group">
          <label>Mã NCC</label>
          <div class="code-badge"><i class="fas fa-tag"></i> NCC005</div>
        </div>
        <div class="form-group">
          <label>Tên NCC <span class="req">*</span></label>
          <input class="form-control" placeholder="Tên nhà cung cấp" id="c-name" />
        </div>
        <div class="form-group">
          <label>Mã số thuế</label>
          <input class="form-control" placeholder="10 hoặc 13 chữ số" maxlength="13" id="c-taxcode" />
        </div>
        <div class="form-group">
          <label>Website</label>
          <input class="form-control" placeholder="https://..." id="c-website" />
        </div>
      </div>

      <hr class="divider" />

      <!-- Địa chỉ -->
      <div class="section-title"><i class="fas fa-location-dot"></i>Địa chỉ</div>
      <div class="grid-2" style="margin-bottom:6px;">
        <div class="form-group">
          <label>Tỉnh / Thành phố</label>
          <select class="form-select" id="c-province">
            <option value="">— Chọn Tỉnh/Thành phố —</option>
            <option>TP. Hồ Chí Minh</option>
            <option>Hà Nội</option>
            <option>Đắk Lắk</option>
          </select>
        </div>
        <div class="form-group">
          <label>Xã / Phường / Đặc khu</label>
          <select class="form-select" id="c-ward" disabled>
            <option value="">— Chọn Xã/Phường/Đặc khu —</option>
          </select>
        </div>
        <div class="form-group">
          <label>Số nhà / Tên đường</label>
          <input class="form-control" placeholder="VD: 123 Nguyễn Văn Linh" id="c-street" />
        </div>
      </div>

      <hr class="divider" />

      <!-- SĐT -->
      <div class="section-title"><i class="fas fa-phone"></i>Số điện thoại</div>
      <div class="primary-row">
        <span class="tag-primary">Chính</span>
        <input class="form-control" placeholder="SĐT chính (10-11 số) *" maxlength="11" id="c-phone" />
      </div>
      <!-- Extra phones list placeholder -->
      <div id="c-phone-extra-list"></div>
      <div class="add-row" style="margin-top:8px;">
        <input class="form-control" placeholder="SĐT phụ (10-11 số)" maxlength="11" id="c-phone-extra" />
        <button class="btn btn-outline btn-sm"><i class="fas fa-plus"></i> Thêm SĐT phụ</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div id="createStep2" class="wizard-panel">

      <!-- Ngân hàng -->
      <div class="section-title"><i class="fas fa-building-columns"></i>Tài khoản ngân hàng</div>
      <div class="primary-row"><span class="tag-primary">Chính</span></div>
      <div class="grid-3" style="margin-bottom:10px;">
        <div class="form-group">
          <label>Tên ngân hàng <span class="req">*</span></label>
          <select class="form-select">
            <option>Chọn ngân hàng</option>
            <option>MBBank</option><option>Vietcombank</option><option>Techcombank</option>
            <option>ACB</option><option>BIDV</option><option>Agribank</option>
          </select>
        </div>
        <div class="form-group">
          <label>Số tài khoản <span class="req">*</span></label>
          <input class="form-control" placeholder="Chỉ nhập số (tối thiểu 6)" maxlength="20" />
        </div>
        <div class="form-group">
          <label>Chủ tài khoản <span class="req">*</span></label>
          <input class="form-control" placeholder="Chủ tài khoản" />
        </div>
      </div>
      <button class="btn btn-outline btn-sm"><i class="fas fa-plus"></i> Thêm TK ngân hàng phụ</button>

      <hr class="divider" />

      <!-- Người liên hệ -->
      <div class="section-title"><i class="fas fa-user-tie"></i>Người liên hệ</div>
      <div class="primary-row"><span class="tag-primary">Chính</span></div>
      <div class="grid-2" style="margin-bottom:10px;">
        <div class="form-group">
          <label>Họ tên <span class="req">*</span></label>
          <input class="form-control" placeholder="Tên người liên hệ" />
        </div>
        <div class="form-group">
          <label>Chức vụ</label>
          <input class="form-control" placeholder="VD: Giám đốc kinh doanh" />
        </div>
        <div class="form-group">
          <label>SĐT người liên hệ</label>
          <input class="form-control" placeholder="10-11 số, bắt đầu bằng 0" maxlength="11" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" placeholder="vd: ten@congty.com" type="email" />
        </div>
      </div>
      <button class="btn btn-outline btn-sm"><i class="fas fa-plus"></i> Thêm người liên hệ phụ</button>
    </div>

  </div><!-- /modal-body -->

  <!-- Footer -->
  <div class="modal-footer">
    <button class="btn btn-outline" id="btnWizardPrev" style="display:none;"><i class="fas fa-arrow-left"></i> Quay lại</button>
    <div class="modal-footer-spacer"></div>
    <button class="btn btn-primary" id="btnWizardNext"><i class="fas fa-arrow-right"></i> Tiếp theo</button>
    <button class="btn btn-success" id="btnSaveCreate" style="display:none;"><i class="fas fa-floppy-disk"></i> Lưu</button>
    <button class="btn btn-outline">Đóng</button>
  </div>
</div>

<script>
let currentStep = 1;
const btnNext = document.getElementById('btnWizardNext');
const btnPrev = document.getElementById('btnWizardPrev');
const btnSave = document.getElementById('btnSaveCreate');

btnNext.addEventListener('click', () => {
  if (currentStep === 1) {
    document.getElementById('createStep1').classList.remove('active');
    document.getElementById('createStep2').classList.add('active');
    document.querySelectorAll('.wizard-step')[1].classList.add('active');
    btnPrev.style.display = 'inline-flex';
    btnNext.style.display = 'none';
    btnSave.style.display = 'inline-flex';
    currentStep = 2;
  }
});

btnPrev.addEventListener('click', () => {
  if (currentStep === 2) {
    document.getElementById('createStep2').classList.remove('active');
    document.getElementById('createStep1').classList.add('active');
    document.querySelectorAll('.wizard-step')[1].classList.remove('active');
    btnPrev.style.display = 'none';
    btnNext.style.display = 'inline-flex';
    btnSave.style.display = 'none';
    currentStep = 1;
  }
});
</script>
</body>
</html>
