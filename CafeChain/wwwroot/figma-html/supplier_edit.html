<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sửa Nhà cung cấp — CafeChain Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root{--bg:#F7F3EE;--surface:#FFFFFF;--primary:#6F4E37;--primary-h:#5C3F2B;--accent:#C67A45;--text:#1F2937;--muted:#475569;--success:#2F6F5E;--warning:#99623B;--danger:#991B1B;--border:#E5E0D8;--radius:10px;--shadow:0 4px 24px rgba(111,78,55,.08);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.modal-box{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(111,78,55,.18);width:540px;max-width:96vw;overflow:hidden;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.modal-header-left{display:flex;align-items:center;gap:12px;}
.modal-icon{width:38px;height:38px;border-radius:10px;background:#F5EDE3;display:flex;align-items:center;justify-content:center;}
.modal-icon i{font-size:15px;color:var(--accent);}
.modal-header h5{font-size:16px;font-weight:800;color:var(--text);}
.close-btn{width:30px;height:30px;border-radius:7px;border:none;background:#F5EDE3;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;}
.close-btn:hover{background:#FEE2E2;color:var(--danger);}
.modal-body{padding:24px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--border);background:#FAF7F4;}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.col-span-2{grid-column:span 2;}
/* Form elements */
.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:12px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:.4px;}
.req{color:var(--danger);}
.form-control,.form-select{padding:9px 13px;border:1.5px solid #DDD6CE;border-radius:8px;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .18s,box-shadow .18s;}
.form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(111,78,55,.13);}
/* Code badge */
.code-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:#F5EDE3;border:1.5px solid #DBC4A9;color:var(--warning);font-size:13px;font-weight:800;}
/* Status indicator */
.status-select-wrap{position:relative;}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;text-decoration:none;transition:all .18s;}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{background:#256058;}
.btn-outline{background:#fff;color:var(--muted);border:1.5px solid #D6C4B0;}
.btn-outline:hover{background:#F5F5F5;}
</style>
</head>
<body>
<div class="modal-box">
  <!-- Header -->
  <div class="modal-header">
    <div class="modal-header-left">
      <div class="modal-icon"><i class="fas fa-pen-to-square"></i></div>
      <h5>Sửa Nhà Cung Cấp</h5>
    </div>
    <button class="close-btn"><i class="fas fa-times"></i></button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <div class="grid-2">
      <!-- Mã NCC (readonly) -->
      <div class="form-group">
        <label>Mã NCC</label>
        <div class="code-badge"><i class="fas fa-tag"></i> NCC001</div>
      </div>
      <!-- Tên NCC -->
      <div class="form-group">
        <label>Tên NCC <span class="req">*</span></label>
        <input class="form-control" value="Công ty CP Thực phẩm Hoà Lộc" id="e-name" />
      </div>
      <!-- Mã số thuế -->
      <div class="form-group">
        <label>Mã số thuế</label>
        <input class="form-control" value="0312456789" placeholder="10 hoặc 13 chữ số" maxlength="13" id="e-taxcode" />
      </div>
      <!-- Website -->
      <div class="form-group">
        <label>Website</label>
        <input class="form-control" value="https://hoaloc.vn" id="e-website" />
      </div>
      <!-- Trạng thái (full width) -->
      <div class="form-group col-span-2">
        <label>Trạng thái</label>
        <select class="form-select" id="e-active">
          <option value="true" selected>Hoạt động</option>
          <option value="false">Ngưng</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="btn btn-success" id="btnSaveEdit"><i class="fas fa-floppy-disk"></i> Lưu</button>
    <button class="btn btn-outline">Đóng</button>
  </div>
</div>
</body>
</html>
