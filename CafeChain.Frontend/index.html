<!doctype html>
<html lang="vi" data-culture="vi-VN" data-theme-preference="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          localStorage.removeItem('cafechain.theme')
          const locale = localStorage.getItem('cafechain.locale') === 'en-US' ? 'en-US' : 'vi-VN'
          document.documentElement.dataset.themePreference = 'light'
          document.documentElement.dataset.theme = 'light'
          document.documentElement.dataset.culture = locale
          document.documentElement.lang = locale === 'en-US' ? 'en' : 'vi'
          document.documentElement.style.colorScheme = 'light'
        } catch { /* PreferencesProvider applies safe defaults when storage is unavailable. */ }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="CafeChain POS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>CafeChain POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
