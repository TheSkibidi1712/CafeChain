name: CI-CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
# =========================
# CI JOB
# =========================
  ci:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore
        run: dotnet restore CafeChain/CafeChain.slnx

      - name: Build
        run: |
          dotnet build CafeChain/CafeChain.slnx `
            --configuration Release `
            --no-restore

      - name: Test
        run: |
          dotnet test CafeChain/CafeChain.slnx `
            --configuration Release `
            --no-build `
            --verbosity normal


# =========================
# CD JOB
# =========================
  cd:
    name: Publish
    needs: ci
    runs-on: windows-latest

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Web App
        run: |
          dotnet publish CafeChain/<StartupProject>/<StartupProject>.csproj `
            --configuration Release `
            --output publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CafeChain-Web
          path: publish
